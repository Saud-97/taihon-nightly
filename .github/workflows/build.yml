name: Build job

on:
  # Every day at 17:30 UTC
  schedule:
    - cron: '30 17 * * *'
  # Manual triggers
  workflow_dispatch:
    inputs:
      git-ref:
        description: Git Ref (Optional)
        required: false
      dry-run:
        description: Creates a draft release
        required: false
        type: boolean

env:
  MIHON_GITHUB_RELEASE: true

jobs:
  check:
    name: Check for new commits
    runs-on: 'ubuntu-26.04'
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      commit-count: ${{ steps.check.outputs.commit-count }}
      current-sha: ${{ steps.check.outputs.current-sha }}
      prev-tag: ${{ steps.check.outputs.prev-tag }}
    steps:
      - name: Clone Repository (Latest)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'Saud-97/taihon'
          fetch-depth: 0
          filter: blob:none
        if: github.event.inputs.git-ref == ''
      - name: Clone Repository (Custom Ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event.inputs.git-ref != ''
        with:
          repository: 'Saud-97/taihon'
          fetch-depth: 0
          filter: blob:none
          ref: ${{ github.event.inputs.git-ref }}

      - name: Compare against latest release
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          commit_count=$(git rev-list --count HEAD)
          echo "commit-count=$commit_count" >> $GITHUB_OUTPUT
          echo "current-sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

          tag_name=$(gh release list --repo Saud-97/taihon-nightly --exclude-drafts --exclude-pre-releases --json tagName --limit 1 --jq 'select(length > 0) | .[0].tagName')
          if [ -z "$tag_name" ]; then
            tag_name="r0"
          fi
          echo "Latest Tag: $tag_name"
          echo "prev-tag=$tag_name" >> $GITHUB_OUTPUT

          prev_commit_count=$(echo "$tag_name" | sed -e "s/^r//")
          if [ "$commit_count" -le "$prev_commit_count" ] && [ "${{ github.event_name }}" = 'schedule' ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "No new commits since $tag_name, skipping build"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build app
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: 'ubuntu-26.04'
    env:
      COMMIT_COUNT: ${{ needs.check.outputs.commit-count }}
      CURRENT_SHA: ${{ needs.check.outputs.current-sha }}
      PREV_TAG: ${{ needs.check.outputs.prev-tag }}
    steps:
      - name: Clone Repository (Latest)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'Saud-97/taihon'
          fetch-depth: 0
        if: github.event.inputs.git-ref == ''
      - name: Clone Repository (Custom Ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event.inputs.git-ref != ''
        with:
          repository: 'Saud-97/taihon'
          fetch-depth: 0
          ref: ${{ github.event.inputs.git-ref }}

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Decode signing keystore
        run: echo "$SIGNING_KEY" | base64 -d > "${{ runner.temp }}/antsy.keystore"
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      - name: Build APK
        run: ./gradlew assembleNightly -Pdist=github
        env:
          storeFile: ${{ runner.temp }}/antsy.keystore
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          prev_commit_count=$(echo "${{ env.PREV_TAG }}" | sed -e "s/^r//")
          commit_count_diff=$((${{ env.COMMIT_COUNT }} - $prev_commit_count))
          
          if [ "${{ env.PREV_TAG }}" != "r0" ]; then
            prev_release_sha=$(git rev-parse --short HEAD~$commit_count_diff)
            echo "PREV_RELEASE_SHA=$prev_release_sha" >> $GITHUB_ENV
            echo "COMPARE_URL=https://github.com/Saud-97/taihon/compare/$prev_release_sha...${{ env.CURRENT_SHA }}" >> $GITHUB_ENV

            echo "COMMIT_LOGS<<{delimiter}" >> $GITHUB_ENV
            curl -s -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/Saud-97/taihon/compare/$prev_release_sha...${{ env.CURRENT_SHA }}" \
              | jq '[.commits[]?|{message:(.commit.message | split("\n")), username:.author.login}]' \
              | jq -r '.[]|"- \(.message | first) (@\(.username))"' >> $GITHUB_ENV
            echo "{delimiter}" >> $GITHUB_ENV
          else
            echo "PREV_RELEASE_SHA=" >> $GITHUB_ENV
            echo "COMPARE_URL=https://github.com/Saud-97/taihon/commits/${{ env.CURRENT_SHA }}" >> $GITHUB_ENV
            echo "COMMIT_LOGS=Initial release" >> $GITHUB_ENV
          fi

      - name: Clean up build artifacts
        run: |
          set -e

          mv app/build/outputs/apk/nightly/app-universal-nightly.apk taihon-r${{ env.COMMIT_COUNT }}.apk
          mv app/build/outputs/apk/nightly/app-arm64-v8a-nightly.apk taihon-arm64-v8a-r${{ env.COMMIT_COUNT }}.apk
          mv app/build/outputs/apk/nightly/app-armeabi-v7a-nightly.apk taihon-armeabi-v7a-r${{ env.COMMIT_COUNT }}.apk
          mv app/build/outputs/apk/nightly/app-x86-nightly.apk taihon-x86-r${{ env.COMMIT_COUNT }}.apk
          mv app/build/outputs/apk/nightly/app-x86_64-nightly.apk taihon-x86_64-r${{ env.COMMIT_COUNT }}.apk

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: r${{ env.COMMIT_COUNT }}
          repository: Saud-97/taihon-nightly
          name: Taihon Nightly r${{ env.COMMIT_COUNT }}
          body: |
            ### Commits

            ${{ env.COMPARE_URL }}

            ${{ env.COMMIT_LOGS }}

            <!-->
            > [!TIP]
            >
            > ### If you are unsure which version to download then go with `taihon-r${{ env.COMMIT_COUNT }}.apk`
          files: |
            taihon-r${{ env.COMMIT_COUNT }}.apk
            taihon-arm64-v8a-r${{ env.COMMIT_COUNT }}.apk
            taihon-armeabi-v7a-r${{ env.COMMIT_COUNT }}.apk
            taihon-x86-r${{ env.COMMIT_COUNT }}.apk
            taihon-x86_64-r${{ env.COMMIT_COUNT }}.apk
          draft: ${{ github.event.inputs.dry-run }}
          prerelease: false
          token: ${{ secrets.MIHON_BOT_TOKEN }}

      - name: Prune old releases
        uses: dev-drprasad/delete-older-releases@dfbe6be2a006e9475dfcbe5b8d201f1824c2a9fe # v0.3.4
        env:
          GITHUB_TOKEN: ${{ secrets.MIHON_BOT_TOKEN }}
        with:
          repo: Saud-97/taihon-nightly
          keep_latest: 365
          delete_tags: true
